---
# Python interpreters installed with uv
python_versions:
  - "3.9"
  - "3.10"
  - "3.11"
  - "3.12"
  - "3.13"
  - "3.14"
uv_python_install_dir: /srv/uv

# Version of nvm itself, see https://github.com/nvm-sh/nvm/releases
nvm_version: 0.40.3
# Node version that nvm installs and sets as default for the
# jenkins user. The robotframework tests need at least node 22.
nvm_node_version: "22"

firefox_version: 70.0.1-0ubuntu1
firefox_file_name: "firefox-mozilla-build_{{ firefox_version }}_amd64.deb"
firefox_url: "https://sourceforge.net/projects/ubuntuzilla/files/mozilla/apt/pool/main/f/firefox-mozilla-build/{{ firefox_file_name }}"
firefox_checksum: cf062abd196df71ea444b68c94b32344763e2455d4afc1100eb826c0f8b9d123c70cbfa547e7f807abb6a53ce62caa0e0ce90542ca8084619630fb0f5ba9ba7a

geckodriver_version: 0.26.0
geckodriver_file_name: "geckodriver-v{{ geckodriver_version }}-linux64.tar.gz"
geckodriver_url: "https://github.com/mozilla/geckodriver/releases/download/v{{ geckodriver_version }}/{{ geckodriver_file_name }}"
geckodriver_checksum: 65a3062ba400a9dc5db19ad1527e0fe65e73c46b79d6bccc071981431d626ff2be7c6258a08d376939c9953eff6e71d57c875ffca0e85e38ffd543690c3851ee

gh_raw: https://raw.githubusercontent.com
gh_jenkins_repo: plone/jenkins.plone.org
